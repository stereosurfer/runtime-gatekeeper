<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runtime Gatekeeper</title>
<style>
:root{font:15px system-ui,sans-serif;color:#e9eee9;background:#111713}*{box-sizing:border-box}body{margin:0}main{max-width:1150px;margin:auto;padding:40px 26px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:28px;margin:5px 0}h2{font-size:18px;margin:30px 0 14px}p{color:#aebcb1;line-height:1.6}.eyebrow{color:#a6d6b3;font-size:12px;letter-spacing:2px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}.metric,.service,.job{border:1px solid #334139;border-radius:12px;padding:18px;background:#1a231d}.metric strong{display:block;font-size:23px;margin-top:8px}.muted,small{color:#acb9af}.services{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{font-size:12px;color:#bcdbc4;background:#2b4030;padding:4px 9px;border-radius:30px}.ram{font-size:28px;margin:20px 0 5px}button{border:1px solid #566c5c;background:#243e2d;color:#e7f2e9;padding:8px 12px;border-radius:7px;cursor:pointer;margin:4px 6px 0 0}button:disabled{opacity:.4;cursor:default}button:hover:enabled{background:#37563f}details{margin-top:16px}summary{cursor:pointer;color:#becfc2}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px 4px;border-bottom:1px solid #334139;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.job{margin-bottom:10px}#notice{color:#ffd297;white-space:pre-wrap}input{background:#1b251e;border:1px solid #536b59;border-radius:5px;color:white;padding:10px;max-width:100%}dialog{color:#e9eee9;background:#1a231d;border:1px solid #536b59;border-radius:14px;max-width:550px}dialog::backdrop{background:#0009}@media(max-width:650px){main{padding:24px 16px}.metrics{grid-template-columns:repeat(2,1fr)}.services{grid-template-columns:1fr}header{align-items:start}h1{font-size:23px}}
</style>
<main><header><div><div class="eyebrow">LOCAL WORKSTATION</div><h1>Runtime Gatekeeper</h1><p>工作、服務與程序，在同一個工作台。</p></div><span class="pill" id="connection">連線中</span></header>
<div id="login" hidden><p>貼上 daemon 顯示的存取權杖，或使用啟動時的完整網址。</p><input id="token" type="password" placeholder="存取權杖"><button id="connect">連線</button></div>
<div id="notice" role="status" aria-live="polite"></div><div class="metrics" id="metrics"></div><h2>工作與租約</h2><div id="jobs"></div><div class="top"><h2>服務</h2><button id="cleanup">清理閒置暫用服務</button></div><div class="services" id="services"></div><details><summary id="unknown-label">未歸屬程序</summary><p>只供查看，沒有程序終止操作。程序量測總和與 macOS 已用 RAM 可能不同；正值表示程序量測有共享或重疊，負值表示還有核心、壓縮、共享記憶體或檔案快取未落在程序表中。</p><div id="unknown"></div></details><p><small id="updated"></small></p></main>
<dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-body"></p><button id="confirm-yes">確認執行</button><button id="confirm-no">取消</button></dialog>
<script>
const $=id=>document.getElementById(id);const localFile=location.protocol==='file:';let token=location.hash.slice(1)||sessionStorage.getItem('runtime-token')||'';if(location.hash){sessionStorage.setItem('runtime-token',token);history.replaceState(null,'',location.pathname)}let busy=false,online=false,storageFailed=false,epoch=0;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const size=n=>(n/1073741824).toFixed(2)+' GiB';
const signedSize=n=>(n<0?'−':'')+size(Math.abs(n));
function controls(){for(const b of document.querySelectorAll('button'))if(b.id!=='connect'&&b.id!=='confirm-no')b.disabled=busy||!online||storageFailed;}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(r.status===401?'需要有效的存取權杖':'連線失敗：'+r.status);return r.json()}
function processTable(rows){const table=el('table');const head=el('tr');['PID / 程序','RAM','CPU'].forEach(x=>head.append(el('th',x)));table.append(head);for(const p of rows){const tr=el('tr');tr.append(el('td',p.pid+' / '+p.name),el('td',size(p.ram_bytes)),el('td',p.cpu_percent.toFixed(1)+'%'));table.append(tr)}return table}
function unknownGroup(name){if(name==='Google Chrome'||name.startsWith('Google Chrome Helper')||name==='chrome_crashpad_handler'||name==='ChatGPT for Chrome')return 'Google Chrome';if(name==='ChatGPT'||name==='codex'||name.startsWith('Codex')||name==='codex-code-mode-host'||name==='SkyComputerUseService'||name==='browser_crashpad_handler')return 'ChatGPT / Codex Desktop';if(name==='Safari'||name.startsWith('com.apple.Safari'))return 'Safari';if(name==='Hermes'||name.startsWith('Hermes Helper'))return 'Hermes';if(name.startsWith('com.apple.WebKit'))return 'WebKit / In-app Browser';if(name==='python'||name==='node'||name==='node_repl')return 'Python / Node';return '其他系統程序'}
function unknownGroupTable(rows,opened){const groups=new Map();for(const p of rows){const name=unknownGroup(p.name);const g=groups.get(name)||{name,rows:[],ram:0};g.rows.push(p);g.ram+=p.ram_bytes;groups.set(name,g)}const wrap=el('div');for(const g of [...groups.values()].sort((a,b)=>b.ram-a.ram)){const d=el('details');d.dataset.key='unknown-group-'+g.name;d.open=opened.has(d.dataset.key);const s=el('summary',g.name+' · '+g.rows.length+' 個程序 · '+size(g.ram));d.append(s,processTable(g.rows));wrap.append(d)}return wrap}
function ask(title,body,run){if(busy||!online||storageFailed)return;$('confirm-title').textContent=title;$('confirm-body').textContent=body;$('confirm').showModal();$('confirm-yes').onclick=()=>{$('confirm').close();run()};$('confirm-no').onclick=()=>$('confirm').close()}
async function action(name,args){
 if(busy||!online||storageFailed)return;
 busy=true;epoch++;controls();$('notice').textContent='操作處理中，請稍候…';
 try{
  const r=await api('/rpc',{jsonrpc:'2.0',id:Date.now(),method:'tools/call',params:{name,arguments:args}});
  const out=r.result?.structuredContent;
  if(r.error)throw Error(r.error.message);
  if(r.result.isError)throw Error(r.result.content[0].text);
  if(out?.status==='BLOCKED_RESOURCE')$('notice').textContent='記憶體不足，尚缺 '+size(out.shortfall)+'。沒有停止其他工作。';
  else if(name==='runtime.cleanup'){
   const failed=(out?.results||[]).filter(x=>x.result!=='stopped');
   $('notice').textContent=failed.length?'部分服務未能停止：'+failed.map(x=>x.service+' — '+x.result).join('；'):'已停止 '+(out?.results?.length||0)+' 個閒置暫用服務。';
  }else $('notice').textContent=out?.status==='RELEASED'?'已釋放工作租約。':'服務操作已完成。';
 }catch(e){$('notice').textContent='操作未確認成功：'+e.message+'。請先核對目前狀態，再決定是否重試。';}
 finally{busy=false;await refresh();controls();}
}
async function refresh(){const current=++epoch;try{const s=await api('/api/status');if(current!==epoch)return;const recovered=!online||storageFailed;online=true;storageFailed=s.storage_failed;if(recovered&&!storageFailed)$('notice').textContent='已連線，控制狀態已更新。';const opened=new Set([...document.querySelectorAll('details[data-key][open]')].map(d=>d.dataset.key));$('login').hidden=true;if(s.storage_failed)$('notice').textContent='狀態儲存失敗，已停用控制操作。請修復儲存空間後重新啟動。';$('connection').textContent='本機連線正常';$('metrics').replaceChildren();for(const [label,value] of [['已用 / 總 RAM',size(s.memory.used)+' / '+size(s.memory.total)],['程序量測總和',size(s.memory.process_total)],['未歸屬程序 RAM',size(s.memory.unknown_process_ram)],['程序量測 − 系統已用',signedSize(s.memory.process_total-s.memory.used)],['可用 RAM（未扣安全餘裕）',size(s.memory.available)],['Swap',size(s.memory.swap_used)],['CPU',s.cpu_percent.toFixed(1)+'%']]){const n=el('div',label,'metric muted');n.append(el('strong',value));$('metrics').append(n)}
$('jobs').replaceChildren();const active=s.jobs.filter(j=>j.status!=='RELEASED');if(!active.length)$('jobs').append(el('p','目前沒有工作租約。Agent 送出 runtime.request 後會顯示於此。'));for(const j of active){const n=el('div',undefined,'job');const row=el('div',undefined,'top');row.append(el('strong',j.request.agent+' / '+j.request.job_id),el('span',j.status,'pill'));n.append(row,el('p',j.request.requires.join(' · ')));if(j.status==='BLOCKED_RESOURCE')n.append(el('p','需求 '+size(j.result.required)+' · 可用 '+size(j.result.available)+' · 尚缺 '+size(j.result.shortfall)));const d=el('details');d.dataset.key='job-'+j.runtime_id;d.open=opened.has(d.dataset.key);d.append(el('summary','租約與判定詳情'),el('pre',JSON.stringify(j,null,2)));n.append(d);const b=el('button','釋放租約');b.onclick=()=>ask('釋放 '+j.request.job_id,'確認工作已完成。釋放後服務可能在清理時停止。',()=>action('runtime.release',{runtime_id:j.runtime_id}));n.append(b);$('jobs').append(n)}
$('services').replaceChildren();for(const v of s.services){const n=el('article',undefined,'service');const row=el('div',undefined,'top');row.append(el('strong',v.id),el('span',v.class+' · '+v.state,'pill'));n.append(row,el('div',v.class==='discovered'&&v.state!=='stopped'&&!v.processes.length?'RAM 未歸屬':size(v.ram_bytes),'ram'),el('small','CPU '+v.cpu_percent.toFixed(1)+'% · 啟動估計 '+size(v.memory_estimate_bytes)+(v.port?' · Port '+v.port+' '+(v.healthy?'✓':'—'):'')));n.append(el('p',v.leases.length?v.leases.map(j=>j.agent+' / '+j.job_id).join(' · '):'無租約'+(v.class==='discovered'?' · 外部使用情況未知':'')));for(const a of v.actions){const labels={start:'啟動',stop:'停止',restart:'重新啟動'};const b=el('button',labels[a]);b.onclick=()=>ask(labels[a]+' '+v.id,'只控制此 daemon 啟動且沒有租約的服務。',()=>action('services.'+a,{service_id:v.id}));n.append(b)}const d=el('details');d.dataset.key='service-'+v.id;d.open=opened.has(d.dataset.key);d.append(el('summary','程序歸屬（'+v.processes.length+'）'),processTable(v.processes));n.append(d);$('services').append(n)}$('unknown-label').textContent='未歸屬程序 · '+s.unknown.length+' · '+size(s.memory.unknown_process_ram);$('unknown').replaceChildren(unknownGroupTable(s.unknown,opened));$('updated').textContent='更新於 '+new Date().toLocaleTimeString()+' · 每 5 秒更新 · 安全餘裕 '+size(s.memory.safety_margin);
controls();}catch(e){if(current!==epoch)return;online=false;$('connection').textContent='未連線 · 畫面為上次資料';$('login').hidden=false;$('notice').textContent=e.message+'。控制操作已停用。';controls();}}
$('connect').onclick=()=>{token=$('token').value;sessionStorage.setItem('runtime-token',token);refresh()};$('cleanup').onclick=()=>ask('清理閒置暫用服務','只停止 managed、disposable 且沒有租約的服務。',()=>action('runtime.cleanup',{}));if(localFile){$('connection').textContent='請使用本機網址';$('notice').textContent='這是 dashboard.html 原始檔預覽，沒有連到監控服務。請使用 daemon 啟動時顯示的 http://127.0.0.1:47831/ 完整網址，或執行本機的 open-panel.sh。';$('login').hidden=true;online=false;controls()}else{controls();refresh();setInterval(()=>{if(!busy)refresh()},5000)}
</script></html>
