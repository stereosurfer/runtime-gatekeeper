<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runtime Gatekeeper</title>
<style>
:root{font:15px system-ui,sans-serif;color:#e9eee9;background:#111713}*{box-sizing:border-box}body{margin:0}main{max-width:1150px;margin:auto;padding:40px 26px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:28px;margin:5px 0}h2{font-size:18px;margin:30px 0 14px}p{color:#aebcb1;line-height:1.6}.eyebrow{color:#a6d6b3;font-size:12px;letter-spacing:2px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}.metric,.service,.job{border:1px solid #334139;border-radius:12px;padding:18px;background:#1a231d}.metric strong{display:block;font-size:23px;margin-top:8px}.muted,small{color:#acb9af}.services{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{font-size:12px;color:#bcdbc4;background:#2b4030;padding:4px 9px;border-radius:30px}.ram{font-size:28px;margin:20px 0 5px}button{border:1px solid #566c5c;background:#243e2d;color:#e7f2e9;padding:8px 12px;border-radius:7px;cursor:pointer;margin:4px 6px 0 0}button:disabled{opacity:.4;cursor:default}button:hover:enabled{background:#37563f}details{margin-top:16px}summary{cursor:pointer;color:#becfc2}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px 4px;border-bottom:1px solid #334139;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.job{margin-bottom:10px}#notice{color:#ffd297;white-space:pre-wrap}input{background:#1b251e;border:1px solid #536b59;border-radius:5px;color:white;padding:10px;max-width:100%}dialog{color:#e9eee9;background:#1a231d;border:1px solid #536b59;border-radius:14px;max-width:550px}dialog::backdrop{background:#0009}@media(max-width:650px){main{padding:24px 16px}.metrics{grid-template-columns:repeat(2,1fr)}.services{grid-template-columns:1fr}header{align-items:start}h1{font-size:23px}}
</style>
<main><header><div><div class="eyebrow">LOCAL WORKSTATION</div><h1>Runtime Gatekeeper</h1><p>工作、服務與程序，在同一個工作台。</p></div><span class="pill" id="connection">連線中</span></header>
<div id="login" hidden><p>貼上 daemon 顯示的存取權杖，或使用啟動時的完整網址。</p><input id="token" type="password" placeholder="存取權杖"><button id="connect">連線</button></div>
<div id="notice" role="status" aria-live="polite"></div><div class="metrics" id="metrics"></div><h2>MCP 連線診斷</h2><div id="diagnostics" class="job"></div><p id="memory-note"></p><h2>工作與租約</h2><div id="jobs"></div><div class="top"><h2>服務</h2><button id="cleanup">清理閒置暫用服務</button></div><div class="services" id="services"></div><details><summary id="unknown-label">未歸屬程序</summary><p>只供查看，沒有程序終止操作。Apple Silicon 使用 macOS phys_footprint，包含 Metal/IOAccelerator 圖形記憶體；程序之間可能共享或重疊，所以總和與系統已用 RAM 不一定相等。</p><div id="unknown"></div></details><p><small id="updated"></small></p></main>
<dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-body"></p><button id="confirm-yes">確認執行</button><button id="confirm-no">取消</button></dialog>
<script>
const $=id=>document.getElementById(id);const localFile=location.protocol==='file:';let token=location.hash.slice(1)||sessionStorage.getItem('runtime-token')||'';if(location.hash){sessionStorage.setItem('runtime-token',token);history.replaceState(null,'',location.pathname)}let busy=false,online=false,storageFailed=false,snapshotBlocked=false,epoch=0;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
function size(n) {
 if (!Number.isFinite(n)) return '未取得';
 for (const [scale, unit] of [[2**30,'GiB'],[2**20,'MiB'],[1024,'KiB']]) {
  if (Math.abs(n)>=scale) return (n/scale).toFixed(2)+' '+unit;
 }
 return n+' B';
}
function percent(n) {
 if (!Number.isFinite(n)) return '未取得';
 return n>0 && n<0.1 ? '<0.1%' : n.toFixed(1)+'%';
}
function reading(value, format, snap) {
 if (!Number.isFinite(value)) return '未取得';
 const suffix = snap?.stale ? '（過期）' : snap?.control_operation ? '（控制忙碌，上次取樣）' : '';
 return format(value)+suffix;
}
function metricText(m, format, snap) {
 if (!m || m.availability==='unavailable') return '未取得';
 return reading(m.value,format,m.availability==='stale' && !snap?.control_operation ? {...snap,stale:true} : snap);
}
function groupText(group, snap) {
 const text=metricText(group?.known_bytes,size,snap);
 return group?.unmeasured_count ? text+' · '+group.unmeasured_count+' 個程序未取得' : text;
}
function renderMetrics(s) {
 const system=s.resources?.system||{}, groups=s.resources?.process_accounting||{}, snap=s.snapshot;
 const wrap=$('metrics'); wrap.replaceChildren();
 function card(key,label,text,metrics) {
  const n=el('div',label,'metric muted');
  n.dataset.metric=key;
  n.title=metrics.filter(Boolean).map(m=>[m.source,m.value??'未取得',m.unit].join(' ')).join(' / ');
  n.append(el('strong',text)); wrap.append(n);
 }
 const fmt=(m,f=size)=>metricText(m,f,snap);
 card('ram','已用 / 總 RAM',fmt(system.used)+' / '+fmt(system.total),[system.used,system.total]);
 card('available','可用 RAM',fmt(system.available),[system.available]);
 card('swap','已用 / 總 Swap',fmt(system.swap_used)+' / '+fmt(system.swap_total),[system.swap_used,system.swap_total]);
 card('cpu','主機 CPU',fmt(system.cpu_percent,percent),[system.cpu_percent]);
 for(const [key,label] of [['attributed','已歸屬程序'],['unattributed','未歸屬程序'],['all','全部程序']]) {
  const g=groups[key];
  card(key,label+' · 已量測用量',groupText(g,snap),[g?.known_bytes]);
 }
 const all=groups.all;
 const delta=all?.unmeasured_count===0 && Number.isFinite(all.known_bytes?.value) && Number.isFinite(system.used?.value)
   ? all.known_bytes.value-system.used.value : null;
 card('difference','程序總和 − 系統已用',reading(delta,size,snap),[all?.known_bytes,system.used]);
}
function controls(){for(const b of document.querySelectorAll('button'))if(b.id!=='connect'&&b.id!=='confirm-no')b.disabled=busy||!online||storageFailed||snapshotBlocked;}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(r.status===401?'需要有效的存取權杖':'連線失敗：'+r.status);return r.json()}
function processTable(rows,snap) {
 const table=el('table'), head=el('tr');
 for(const label of ['PID / 程序','記憶體用量','CPU']) head.append(el('th',label));
 table.append(head);
 for(const p of rows) {
  const row=el('tr'); row.dataset.pid=String(p.pid);
  row.append(el('td',p.pid+' / '+p.name),el('td',reading(p.ram_bytes,size,snap)+' · '+(p.memory_basis||'未標示')),
      el('td',reading(p.cpu_percent,percent,snap)));
  table.append(row);
 }
 return table;
}
function renderDiagnostics(s){
 const box=$('diagnostics');box.replaceChildren(el('p','Daemon：可回應 · MCP：stdio bridge · 目前對話的工具曝光：需由該 Agent 確認'));
 if(s.snapshot?.control_operation)box.append(el('p','控制操作進行中：'+s.snapshot.control_operation+'。以下是最近完成的快照，暫停其他面板控制。'));
 const clients=s.mcp?.clients||[];
 if(!clients.length)box.append(el('p','尚未觀察到 MCP bridge 呼叫。面板連線不代表 Agent 已接上 MCP。'));
 for(const c of clients){const when=t=>t?new Date(t*1000).toLocaleTimeString():'尚未觀察到';box.append(el('p',(c.name||'未握手 client')+' '+(c.version||'')+' · '+c.bridge_id.slice(0,8)+' · 握手 '+when(c.initialized_at)+' · 工具清單 '+when(c.tools_list_at)+' · 最近成功呼叫 '+when(c.last_successful_call_at)+' · 最近結果 '+(c.last_result||'未知')))}
 box.append(el('small','以上是本次 daemon 啟動後最近觀察到的紀錄，不保證 client 仍在線；最多保留 64 個 bridge。'));
 const ps=[...(s.unknown||[]),...(s.services||[]).flatMap(v=>v.processes||[])];
 $('memory-note').textContent='系統記憶體壓力：'+({normal:'正常',warning:'警告',critical:'危急'}[s.memory.pressure]||'未取得')+(s.memory.pressure && s.snapshot?.stale?'（過期）':s.memory.pressure && s.snapshot?.control_operation?'（控制忙碌，上次取樣）':'')+'。記憶體計量：'+(s.memory.process_basis||'未標示')+'。本次 RSS 回退 '+ps.filter(p=>p.memory_basis==='rss_fallback').length+' 個程序。程序共享資源可能重疊，不能以加總差額推算遺失記憶體或個別程序 swap。';
}
function unknownGroup(name){if(name==='Google Chrome'||name.startsWith('Google Chrome Helper')||name==='chrome_crashpad_handler'||name==='ChatGPT for Chrome')return 'Google Chrome';if(name==='ChatGPT'||name==='codex'||name.startsWith('Codex')||name==='codex-code-mode-host'||name==='SkyComputerUseService'||name==='browser_crashpad_handler')return 'ChatGPT / Codex Desktop';if(name==='Safari'||name.startsWith('com.apple.Safari'))return 'Safari';if(name==='Hermes'||name.startsWith('Hermes Helper'))return 'Hermes';if(name.startsWith('com.apple.WebKit'))return 'WebKit / In-app Browser';if(name==='python'||name==='node'||name==='node_repl')return 'Python / Node';return '其他系統程序'}
function unknownGroupTable(rows,opened,snap){const groups=new Map();for(const p of rows){const name=unknownGroup(p.name);const g=groups.get(name)||{name,rows:[],ram:0,missing:0};g.rows.push(p);if(Number.isFinite(p.ram_bytes)) g.ram+=p.ram_bytes; else g.missing++;groups.set(name,g)}const wrap=el('div');for(const g of [...groups.values()].sort((a,b)=>b.ram-a.ram)){const d=el('details');d.dataset.key='unknown-group-'+g.name;d.open=opened.has(d.dataset.key);const s=el('summary',g.name+' · '+g.rows.length+' 個程序 · '+reading(g.missing===g.rows.length?null:g.ram,size,snap)+(g.missing?' · '+g.missing+' 個程序未取得':''));d.append(s,processTable(g.rows,snap));wrap.append(d)}return wrap}
function ask(title,body,run){if(busy||!online||storageFailed||snapshotBlocked)return;$('confirm-title').textContent=title;$('confirm-body').textContent=body;$('confirm').showModal();$('confirm-yes').onclick=()=>{$('confirm').close();run()};$('confirm-no').onclick=()=>$('confirm').close()}
async function action(name,args){
 if(busy||!online||storageFailed||snapshotBlocked)return;
 busy=true;epoch++;controls();$('notice').textContent='操作處理中，請稍候…';
 try{
  const r=await api('/rpc',{jsonrpc:'2.0',id:Date.now(),method:'tools/call',params:{name,arguments:args}});
  const out=r.result?.structuredContent;
  if(r.error)throw Error(r.error.message);
  if(r.result.isError)throw Error(r.result.content[0].text);
  if(out?.status==='BLOCKED_RESOURCE')$('notice').textContent=out.resource==='exclusive_group'?'同組重型工作已有租約；沒有停止其他工作。':out.resource==='unknown_service_startup_memory'?'服務啟動記憶體尚未量測，准入已阻擋。':'記憶體不足，尚缺 '+size(out.shortfall)+'。沒有停止其他工作。';
  else if(name==='runtime.cleanup'){
   const failed=(out?.results||[]).filter(x=>x.result!=='stopped');
   $('notice').textContent=failed.length?'部分服務未能停止：'+failed.map(x=>x.service+' — '+x.result).join('；'):'已停止 '+(out?.results?.length||0)+' 個閒置暫用服務。';
  }else $('notice').textContent=out?.status==='RELEASED'?'已釋放工作租約。':'服務操作已完成。';
 }catch(e){$('notice').textContent='操作未確認成功：'+e.message+'。請先核對目前狀態，再決定是否重試。';}
 finally{busy=false;await refresh();controls();}
}
async function refresh(){const current=++epoch;try{const s=await api('/api/status');if(current!==epoch)return;const recovered=!online||storageFailed;online=true;storageFailed=s.storage_failed;snapshotBlocked=!!(s.read_only||s.snapshot?.stale||s.snapshot?.control_operation);if(recovered&&!storageFailed)$('notice').textContent=s.read_only?'已連線，使用唯讀權限。':'已連線，控制狀態已更新。';const opened=new Set([...document.querySelectorAll('details[data-key][open]')].map(d=>d.dataset.key));$('login').hidden=true;if(s.storage_failed)$('notice').textContent='狀態儲存失敗，已停用控制操作。請修復儲存空間後重新啟動。';$('connection').textContent=s.snapshot?.stale?'本機已連線 · 快照過期':s.snapshot?.control_operation?'本機已連線 · 控制忙碌，顯示上次取樣':'本機連線正常';renderDiagnostics(s);renderMetrics(s);
$('jobs').replaceChildren();const active=s.jobs.filter(j=>j.status!=='RELEASED');if(!active.length)$('jobs').append(el('p','目前沒有工作租約。Agent 送出 runtime.request 後會顯示於此。'));for(const j of active){const n=el('div',undefined,'job');const row=el('div',undefined,'top');row.append(el('strong',j.request.agent+' / '+j.request.job_id),el('span',j.status,'pill'));n.append(row,el('p',j.request.requires.join(' · ')));if(j.status==='BLOCKED_RESOURCE')n.append(el('p',j.result.resource==='exclusive_group'?'同組重型工作已有租約':j.result.resource==='unknown_service_startup_memory'?'服務啟動記憶體未量測':'需求 '+size(j.result.required)+' · 可用 '+size(j.result.available)+' · 尚缺 '+size(j.result.shortfall)));if(j.status==='READY'&&j.result.memory_assurance==='unknown')n.append(el('p','額外工作記憶體未量測；READY 不保證生成容量。'));const d=el('details');d.dataset.key='job-'+j.runtime_id;d.open=opened.has(d.dataset.key);d.append(el('summary','租約與判定詳情'),el('pre',JSON.stringify(j,null,2)));n.append(d);const b=el('button','釋放租約');b.onclick=()=>ask('釋放 '+j.request.job_id,'確認工作已完成。釋放後服務可能在清理時停止。',()=>action('runtime.release',{runtime_id:j.runtime_id}));n.append(b);$('jobs').append(n)}
$('services').replaceChildren();for(const v of s.services){const n=el('article',undefined,'service');const row=el('div',undefined,'top');row.append(el('strong',v.id),el('span',v.class+' · '+v.state,'pill'));n.append(row,el('div',reading(v.ram_bytes,size,s.snapshot),'ram'),el('small','CPU '+reading(v.cpu_percent,percent,s.snapshot)+' · 啟動估計 '+size(v.memory_estimate_bytes)+(v.port?' · Port '+v.port+' '+(v.healthy?'✓':'—')+(v.identity_verified===false?' · 身分未核對':''):'')+(v.exclusive_group?' · 互斥 '+v.exclusive_group:'')));n.append(el('p',v.leases.length?v.leases.map(j=>j.agent+' / '+j.job_id).join(' · '):'無租約'+(v.class==='discovered'?' · 外部使用情況未知':'')));for(const a of v.actions){const labels={start:'啟動',stop:'停止',restart:'重新啟動'};const b=el('button',labels[a]);b.onclick=()=>ask(labels[a]+' '+v.id,'只控制此 daemon 啟動且沒有租約的服務。',()=>action('services.'+a,{service_id:v.id}));n.append(b)}const d=el('details');d.dataset.key='service-'+v.id;d.open=opened.has(d.dataset.key);d.append(el('summary','程序歸屬（'+v.processes.length+'）'),processTable(v.processes,s.snapshot));n.append(d);$('services').append(n)}$('unknown-label').textContent='未歸屬程序 · '+s.unknown.length+' · '+groupText(s.resources?.process_accounting?.unattributed,s.snapshot);$('unknown').replaceChildren(unknownGroupTable(s.unknown,opened,s.snapshot));const snap=s.snapshot;
$('updated').textContent='快照 '+(snap?.id??'未取得')+' · 取樣時間 '+(Number.isFinite(snap?.sampled_at)?new Date(snap.sampled_at*1000).toLocaleTimeString():'未取得')+' · 年齡 '+(Number.isFinite(snap?.age_ms)?(snap.age_ms/1000).toFixed(1)+' 秒':'未取得')+' · 每 5 秒更新 · 安全餘裕 '+size(s.memory.safety_margin);
controls();}catch(e){if(current!==epoch)return;online=false;if($('diagnostics').firstChild)$('diagnostics').firstChild.textContent='Daemon：本次查詢失敗 · 以下為歷史觀察，無法確認目前 MCP 狀態';$('connection').textContent='未連線 · 畫面為上次資料';$('login').hidden=false;$('notice').textContent=e.message+'。控制操作已停用。';controls();}}
$('connect').onclick=()=>{token=$('token').value;sessionStorage.setItem('runtime-token',token);refresh()};$('cleanup').onclick=()=>ask('清理閒置暫用服務','只停止 managed、disposable 且沒有租約的服務。',()=>action('runtime.cleanup',{}));if(localFile){$('connection').textContent='請使用本機網址';$('notice').textContent='這是 dashboard.html 原始檔預覽，沒有連到監控服務。請使用 daemon 啟動時顯示的 http://127.0.0.1:47831/ 完整網址，或執行本機的 open-panel.sh。';$('login').hidden=true;online=false;controls()}else{controls();refresh();setInterval(refresh,5000)}
</script></html>
